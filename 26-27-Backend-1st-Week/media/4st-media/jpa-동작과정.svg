<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
<style>
  .lbl { font-family:"Apple SD Gothic Neo","Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:700; }
  .ttl { font-size:34px; fill:#111; text-anchor:middle; }
  .hd  { font-size:28px; fill:#111; text-anchor:middle; }
  .cel { font-size:28px; fill:#111; text-anchor:middle; }
  .in  { font-size:27px; fill:#111; text-anchor:middle; }
  .st  { font-size:27px; fill:#d97706; text-anchor:middle; }
  .sub { font-size:22px; fill:#8a8a8a; text-anchor:middle; }
  .cap { font-size:26px; fill:#8a8a8a; text-anchor:middle; }
  .bx  { fill:none; stroke:#111; stroke-width:3.5; }
  .ln  { stroke:#111; stroke-width:2.5; }
  .thin{ stroke:#9db8dc; stroke-width:2.5; }
  .ar  { fill:none; stroke:#d97706; stroke-width:5; }
</style>
<defs>
  <marker id="ao" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6.5" markerHeight="6.5" orient="auto">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#d97706"/>
  </marker>
  <marker id="ab" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#111"/>
  </marker>
</defs>
<rect width="1600" height="1600" fill="#ffffff"/>
<g class="lbl" transform="translate(0,392)">

  <text class="ttl" x="240"  y="125">애플리케이션</text>
  <text class="ttl" x="800"  y="125">Spring Data JPA + JPA</text>
  <text class="ttl" x="1360" y="125">데이터베이스</text>

  <rect class="bx" x="40" y="160" width="400" height="560" rx="18"/>

  <rect x="95" y="230" width="290" height="90"  fill="#eaf1fb"/>
  <rect x="95" y="320" width="145" height="180" fill="#eaf1fb"/>
  <rect class="bx" x="95" y="230" width="290" height="270" rx="14"/>
  <line class="bx" x1="95" y1="320" x2="385" y2="320"/>
  <line class="ln" x1="95" y1="410" x2="385" y2="410"/>
  <line class="ln" x1="240" y1="320" x2="240" y2="500"/>

  <text class="cel" x="240" y="284">Member</text>
  <text class="cel" x="167" y="373">name</text>
  <text class="cel" x="313" y="373">이길수</text>
  <text class="cel" x="167" y="463">age</text>
  <text class="cel" x="313" y="463">24</text>
  <text class="sub" x="240" y="555">자바 객체</text>

  <rect x="640" y="160" width="320" height="220" rx="18" fill="#fdefd9"/>
  <rect class="bx" x="640" y="160" width="320" height="220" rx="18"/>
  <text class="cel" x="800" y="210">Spring Data JPA</text>
  <line class="thin" x1="690" y1="240" x2="910" y2="240"/>
  <text class="in"  x="800" y="295">Repository</text>
  <text class="sub" x="800" y="335">save() · findById()</text>

  <path class="ln" marker-start="url(#ab)" marker-end="url(#ab)" d="M 800 388 L 800 432"/>

  <rect x="640" y="440" width="320" height="280" rx="18" fill="#eaf1fb"/>
  <rect class="bx" x="640" y="440" width="320" height="280" rx="18"/>
  <text class="cel" x="800" y="485">JPA (Hibernate)</text>
  <line class="thin" x1="690" y1="510" x2="910" y2="510"/>
  <text class="in"  x="800" y="555">객체를 보고</text>
  <text class="in"  x="800" y="590">SQL을 만들고</text>
  <line class="thin" x1="690" y1="615" x2="910" y2="615"/>
  <text class="in"  x="800" y="655">결과를 받아서</text>
  <text class="in"  x="800" y="690">객체에 담습니다</text>

  <rect class="bx" x="1160" y="160" width="400" height="560" rx="18"/>

  <rect x="1195" y="260" width="330" height="80" fill="#eaf1fb"/>
  <rect x="1195" y="340" width="330" height="70" fill="#fdefd9"/>
  <rect class="bx" x="1195" y="260" width="330" height="290" rx="14"/>
  <line class="bx" x1="1195" y1="340" x2="1525" y2="340"/>
  <line class="ln" x1="1195" y1="410" x2="1525" y2="410"/>
  <line class="ln" x1="1195" y1="480" x2="1525" y2="480"/>
  <line class="ln" x1="1360" y1="260" x2="1360" y2="550"/>

  <text class="hd " x="1277" y="313">name</text>
  <text class="hd " x="1442" y="313">age</text>
  <text class="cel" x="1277" y="383">이길수</text>
  <text class="cel" x="1442" y="383">24</text>
  <text class="cel" x="1277" y="453">이삭</text>
  <text class="cel" x="1442" y="453">24</text>
  <text class="cel" x="1277" y="523">안정민</text>
  <text class="cel" x="1442" y="523">23</text>
  <text class="sub" x="1360" y="605">member 테이블</text>

  <path class="ar" marker-end="url(#ao)" d="M 460 250 L 618 250"/>
  <path class="ar" marker-end="url(#ao)" d="M 620 340 L 462 340"/>
  <path class="ar" marker-end="url(#ao)" d="M 980 572 L 1138 572"/>
  <path class="ar" marker-end="url(#ao)" d="M 1140 672 L 982 672"/>

  <text class="st"  x="540"  y="175">① 객체를</text>
  <text class="st"  x="540"  y="210">넘기면</text>
  <text class="sub" x="540"  y="302">Repository로 전달</text>
  <text class="st"  x="540"  y="390">④ 객체에</text>
  <text class="st"  x="540"  y="425">담아서 반환</text>
  <text class="st"  x="1060" y="495">② SQL을</text>
  <text class="st"  x="1060" y="530">만들어서</text>
  <text class="sub" x="1060" y="630">JDBC로 전달</text>
  <text class="st"  x="1060" y="722">③ 결과를</text>
  <text class="st"  x="1060" y="757">돌려주면</text>

</g>
</svg>
